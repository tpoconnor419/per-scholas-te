<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certification readiness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300..800;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16233b;
    --ink-soft: #55617a;
    --paper: #eef1f5;
    --surface: #ffffff;
    --line: #d7dee8;
    --met: #17714f;
    --met-bg: #e2f0e9;
    --unmet: #a3481c;
    --unmet-bg: #fae9de;
    --review: #6a4fa0;
    --review-bg: #eee8f7;
    --accent: #2b52c4;

    --sans: 'Public Sans', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 80px; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  /* ---- Header ---- */
  .masthead {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--ink);
  }
  .masthead h1 {
    margin: 4px 0 0;
    font-size: clamp(26px, 4vw, 36px);
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1.1;
  }
  .runline {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
  }
  .runline .dot { color: var(--line); padding: 0 6px; }

  .btn {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 3px;
    padding: 11px 20px;
    cursor: pointer;
  }
  .btn:hover { background: #23439f; }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .btn[disabled] { background: var(--ink-soft); cursor: progress; }

  /* ---- Tally ---- */
  .tally { display: flex; gap: 28px; flex-wrap: wrap; margin: 22px 0 30px; }
  .tally div { display: flex; align-items: baseline; gap: 8px; }
  .tally b {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .tally span { font-size: 13px; color: var(--ink-soft); }
  .t-ready b { color: var(--met); }
  .t-notready b { color: var(--unmet); }
  .t-review b { color: var(--review); }

  /* ---- Matrix ---- */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
  .panel-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding: 14px 18px; border-bottom: 1px solid var(--line);
  }
  .panel-head p { margin: 0; font-size: 12px; color: var(--ink-soft); }

  .scroller { overflow-x: auto; }

  table { border-collapse: collapse; width: 100%; min-width: 720px; }

  th, td { text-align: left; padding: 0; }

  thead th {
    vertical-align: bottom;
    padding: 14px 12px 10px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
  }
  thead th.req { width: 132px; }
  thead th .rule {
    display: block;
    margin-top: 3px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    text-transform: uppercase;
  }

  th.name-col, td.name-col {
    position: sticky; left: 0;
    background: var(--surface);
    padding-left: 18px;
    min-width: 172px;
    box-shadow: 1px 0 0 var(--line);
  }

  tbody tr { border-bottom: 1px solid var(--line); }
  tbody tr:last-child { border-bottom: 0; }
  tbody tr:hover td { background: #f8fafc; }
  tbody tr:hover td.name-col { background: #f8fafc; }

  td { padding: 11px 12px; vertical-align: top; }

  .learner-name { font-weight: 600; }
  .learner-sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
  }

  /* Cells carry the observed value, not an abstract icon. A program manager
     asking "how close was she?" gets the answer without another click. */
  .cell {
    display: inline-block;
    min-width: 62px;
    padding: 4px 8px;
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    text-align: center;
  }
  .cell.met { background: var(--met-bg); color: var(--met); }
  .cell.unmet { background: var(--unmet-bg); color: var(--unmet); }
  .cell.blank { background: transparent; color: var(--line); }

  .pill {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .pill.ready { background: var(--met-bg); color: var(--met); }
  .pill.not_ready { background: var(--unmet-bg); color: var(--unmet); }
  .pill.needs_review { background: var(--review-bg); color: var(--review); }

  .blocking { display: block; margin-top: 5px; font-size: 12px; color: var(--ink-soft); max-width: 240px; }

  /* The signature row: how many learners cleared each requirement. Reading
     across it names the cohort's bottleneck before you read a single name. */
  tfoot td {
    border-top: 2px solid var(--ink);
    padding: 12px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
  }
  tfoot td.name-col { font-family: var(--sans); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
  tfoot .low { color: var(--unmet); }
  tfoot .all { color: var(--met); }

  /* ---- Issues ---- */
  .issues { margin-top: 30px; }
  .issue {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 14px 18px; border-bottom: 1px solid var(--line);
  }
  .issue:last-child { border-bottom: 0; }
  .issue-tag {
    flex: none;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 3px;
    background: var(--review-bg);
    color: var(--review);
  }
  .issue h3 { margin: 0 0 3px; font-size: 14px; font-weight: 600; }
  .issue p { margin: 0; font-size: 13px; color: var(--ink-soft); }
  .issue a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .issue a:hover { text-decoration: underline; }

  .empty { padding: 40px 18px; text-align: center; color: var(--ink-soft); }
  .empty strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }

  .bar { height: 2px; background: var(--line); overflow: hidden; margin-bottom: -1px; }
  .bar i { display: block; height: 100%; width: 30%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(430%); } }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--ink); color: #fff;
    padding: 11px 18px; border-radius: 4px;
    font-size: 13px; font-weight: 500;
    box-shadow: 0 6px 24px rgba(22,35,59,.24);
  }
  .toast.err { background: var(--unmet); }

  @media (prefers-reduced-motion: reduce) {
    .bar i { animation: none; width: 100%; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 20px 12px 60px; }
    .masthead { align-items: flex-start; }
    .tally { gap: 18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="root"><div class="empty">Loading cohort…</div></div>
</div>

<script>
const $ = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function ago(iso) {
  if (!iso) return 'never';
  const secs = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (secs < 60) return 'just now';
  if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
  if (secs < 86400) return Math.floor(secs / 3600) + 'h ago';
  return Math.floor(secs / 86400) + 'd ago';
}

function ruleLabel(r) {
  if (r.type === 'min_score' && r.threshold != null) return 'min ' + Math.round(r.threshold * 100) + '%';
  if (r.type === 'submission_exists') return 'submitted';
  if (r.type === 'completion') return 'completion';
  return r.type || '';
}

let toastTimer;
function toast(message, isError) {
  document.querySelector('.toast')?.remove();
  const el = $('<div class="toast' + (isError ? ' err' : '') + '">' + esc(message) + '</div>');
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 5000);
}

function render(d) {
  const root = document.getElementById('root');
  root.innerHTML = '';

  const run = d.lastRun;
  const runText = run
    ? 'Synced ' + ago(run.finishedAt || run.startedAt) + '<span class="dot">·</span>' + esc(run.status) + '<span class="dot">·</span>' + esc(run.trigger)
    : 'Not yet synced';

  root.appendChild($(
    '<header class="masthead">' +
      '<div>' +
        '<div class="eyebrow">Certification readiness</div>' +
        '<h1>' + esc(d.cohort.name) + '</h1>' +
        '<div class="runline">' + runText + '</div>' +
      '</div>' +
      '<button class="btn" id="sync">Sync now</button>' +
    '</header>'
  ));

  root.appendChild($(
    '<div class="tally">' +
      '<div class="t-ready"><b>' + d.counts.ready + '</b><span>ready for a voucher</span></div>' +
      '<div class="t-notready"><b>' + d.counts.notReady + '</b><span>still working</span></div>' +
      '<div class="t-review"><b>' + d.counts.needsReview + '</b><span>need review</span></div>' +
    '</div>'
  ));

  // ---- Matrix ----
  if (!d.learners.length) {
    root.appendChild($('<div class="panel"><div class="empty"><strong>No learners yet</strong>Run a sync to pull the roster from Canvas.</div></div>'));
  } else {
    const head = d.requirements.map((r) =>
      '<th class="req" title="' + esc(r.resourceId || '') + '">' + esc(r.name) + '<span class="rule">' + esc(ruleLabel(r)) + '</span></th>'
    ).join('');

    const rows = d.learners.map((l) => {
      const cells = l.cells.map((c) => {
        if (!c.label) return '<td><span class="cell blank">—</span></td>';
        return '<td><span class="cell ' + (c.met ? 'met' : 'unmet') + '">' + esc(c.label) + '</span></td>';
      }).join('');

      return '<tr>' +
        '<td class="name-col">' +
          '<div class="learner-name">' + esc(l.name) + '</div>' +
          '<div class="learner-sub">' + esc(l.sourcedId) + '</div>' +
        '</td>' +
        cells +
        '<td><span class="pill ' + esc(l.status) + '">' + esc(l.status.replace('_', ' ')) + '</span>' +
          (l.blocking ? '<span class="blocking">' + esc(l.blocking) + '</span>' : '') +
        '</td>' +
      '</tr>';
    }).join('');

    const foot = d.requirements.map((r) => {
      const cls = r.cleared === d.counts.total ? 'all' : r.cleared <= d.counts.total / 2 ? 'low' : '';
      return '<td class="' + cls + '">' + r.cleared + '/' + d.counts.total + '</td>';
    }).join('');

    root.appendChild($(
      '<div class="panel">' +
        '<div class="panel-head">' +
          '<div class="eyebrow">Requirements</div>' +
          '<p>Scores show what was recorded in Canvas. Hover a name for the program ID.</p>' +
        '</div>' +
        '<div class="scroller"><table>' +
          '<thead><tr><th class="name-col">Learner</th>' + head + '<th>Status</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
          '<tfoot><tr><td class="name-col">Cleared</td>' + foot + '<td></td></tr></tfoot>' +
        '</table></div>' +
      '</div>'
    ));
  }

  // ---- Issues ----
  if (d.issues.length) {
    const items = d.issues.map((i) =>
      '<div class="issue">' +
        '<span class="issue-tag">' + esc(i.classification) + '</span>' +
        '<div>' +
          '<h3>' + esc(i.title) + '</h3>' +
          '<p>' + esc(i.detail) + '</p>' +
          '<p style="margin-top:6px">Seen ' + i.occurrences + '&times;, last ' + ago(i.lastSeen) +
            (i.asanaUrl ? ' <span class="dot">·</span> <a href="' + esc(i.asanaUrl) + '" target="_blank" rel="noopener">Open in Asana</a>' : '') +
          '</p>' +
        '</div>' +
      '</div>'
    ).join('');

    root.appendChild($(
      '<div class="panel issues">' +
        '<div class="panel-head"><div class="eyebrow">Needs attention (' + d.issues.length + ')</div></div>' +
        items +
      '</div>'
    ));
  }

  document.getElementById('sync')?.addEventListener('click', startSync);
}

async function load() {
  try {
    const res = await fetch('/api/dashboard' + location.search);
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      document.getElementById('root').innerHTML =
        '<div class="panel"><div class="empty"><strong>Cannot load this cohort</strong>' +
        esc(body.error || res.statusText) + '</div></div>';
      return;
    }
    render(await res.json());
  } catch (err) {
    document.getElementById('root').innerHTML =
      '<div class="panel"><div class="empty"><strong>Cannot reach the server</strong>Check the tool is running, then reload.</div></div>';
  }
}

async function startSync() {
  const btn = document.getElementById('sync');
  btn.disabled = true;
  btn.textContent = 'Syncing…';
  document.querySelector('.masthead').insertAdjacentElement('afterend', $('<div class="bar"><i></i></div>'));

  try {
    const res = await fetch('/api/sync' + location.search, { method: 'POST' });
    const body = await res.json();

    if (res.status === 409) { toast('A sync is already running.', true); return finish(); }
    if (!res.ok) { toast(body.error || 'Could not start the sync.', true); return finish(); }

    poll(body.jobId);
  } catch {
    toast('Could not reach the server.', true);
    finish();
  }
}

function finish() {
  const btn = document.getElementById('sync');
  if (btn) { btn.disabled = false; btn.textContent = 'Sync now'; }
  document.querySelector('.bar')?.remove();
}

function poll(jobId) {
  const started = Date.now();
  const timer = setInterval(async () => {
    if (Date.now() - started > 90000) {
      clearInterval(timer);
      toast('The sync is taking longer than expected. Reload to check.', true);
      return finish();
    }

    const res = await fetch('/api/sync/' + jobId + location.search);
    if (!res.ok) return;
    const job = await res.json();
    if (job.status === 'running') return;

    clearInterval(timer);
    if (job.status === 'error') {
      toast('Sync failed (' + job.classification + '): ' + job.error, true);
    } else {
      const n = job.summary?.learnersEvaluated ?? 0;
      toast('Synced ' + n + ' learner' + (n === 1 ? '' : 's') +
        (job.issues ? ' · ' + job.issues + ' need attention' : ''));
    }
    await load();
    finish();
  }, 1200);
}

load();
</script>
</body>
</html>
